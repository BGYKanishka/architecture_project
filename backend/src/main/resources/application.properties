spring.application.name=backend

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookfair_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false

# --- EMAIL CONFIGURATION ---
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.protocol=${SPRING_MAIL_PROTOCOL:smtps}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

# SSL Properties
spring.mail.properties.mail.transport.protocol=smtps
spring.mail.properties.mail.smtps.auth=true
spring.mail.properties.mail.smtps.starttls.enable=true
spring.mail.properties.mail.smtps.ssl.trust=${SPRING_MAIL_SSL_TRUST:smtp.gmail.com}

# Timeouts (10 Seconds default to prevent connection pool starvation)
spring.mail.properties.mail.smtps.timeout=${SPRING_MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtps.connectiontimeout=${SPRING_MAIL_CONN_TIMEOUT:10000}
spring.mail.properties.mail.smtps.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:10000}

spring.mail.debug=${SPRING_MAIL_DEBUG:false}

# JWT Configuration
app.jwtSecret=${JWT_SECRET:rnsl2CfxoeIKRWR71gkfE76P8K0rkQMzRfj2gRVQn08=}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:3000000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80}
