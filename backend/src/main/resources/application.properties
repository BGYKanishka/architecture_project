spring.application.name=backend

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false

# --- EMAIL CONFIGURATION (Amazon SES over authenticated STARTTLS) ---
spring.mail.host=${SPRING_MAIL_HOST:email-smtp.ap-southeast-2.amazonaws.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.protocol=smtp
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
app.mail.from=${APP_MAIL_FROM:${spring.mail.username:}}

# Require authenticated TLS and normal JVM certificate validation.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

# Timeouts (10 Seconds default to prevent connection pool starvation)
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONN_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:10000}

spring.mail.debug=${SPRING_MAIL_DEBUG:false}

# Cognito OAuth 2.0 / OpenID Connect. The server-side client secret is supplied at runtime.
spring.security.oauth2.client.registration.cognito.provider=cognito
spring.security.oauth2.client.registration.cognito.client-id=${COGNITO_CLIENT_ID}
spring.security.oauth2.client.registration.cognito.client-secret=${COGNITO_CLIENT_SECRET}
spring.security.oauth2.client.registration.cognito.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.cognito.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.cognito.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.cognito.scope=openid,email,profile
spring.security.oauth2.client.registration.cognito.client-name=CIBF Cognito
spring.security.oauth2.client.provider.cognito.issuer-uri=https://cognito-idp.${AWS_REGION:ap-southeast-2}.amazonaws.com/${COGNITO_USER_POOL_ID}

# Browser session is only used for the server-side OAuth2 BFF session.
server.servlet.session.timeout=15m
server.servlet.session.cookie.name=CIBFSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework
app.public-url=${APP_PUBLIC_URL:http://localhost:3000}
app.cognito.domain=${COGNITO_DOMAIN}
app.cognito.client-id=${COGNITO_CLIENT_ID}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
