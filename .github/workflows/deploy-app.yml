name: Build and deploy application to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'docker-compose*.yml'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS Region
        type: choice
        required: true
        default: ap-southeast-2
        options:
          - ap-southeast-2
      aws_account_id:
        description: 12-digit AWS account ID
        type: string
        required: true
        default: "744264411889"
      bookfair_ec2_instance_id:
        description: Primary EC2 Instance ID (Node 1)
        type: string
        required: true
        default: "i-0fb5b0b8e9355ca49"
      bookfair_ec2_instance_id_2:
        description: Secondary EC2 Instance ID (Node 2 - optional)
        type: string
        required: false
        default: "i-039e842e3b7fa3c82"

permissions:
  contents: read

concurrency:
  group: cibf-production-deploy
  cancel-in-progress: false

# Shared by all jobs
env:
  AWS_REGION: ${{ inputs.aws_region || 'ap-southeast-2' }}
  AWS_ACCOUNT_ID: ${{ inputs.aws_account_id || '744264411889' }}
  ECR_REGISTRY: ${{ inputs.aws_account_id || '744264411889' }}.dkr.ecr.${{ inputs.aws_region || 'ap-southeast-2' }}.amazonaws.com
  EC2_INSTANCE_ID_1: ${{ inputs.bookfair_ec2_instance_id || 'i-0fb5b0b8e9355ca49' }}
  EC2_INSTANCE_ID_2: ${{ inputs.bookfair_ec2_instance_id_2 || 'i-039e842e3b7fa3c82' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. VALIDATE - fail fast before spending any build minutes
  # ---------------------------------------------------------------------------
  validate:
    name: Validate configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "Deploy only from main." >&2; exit 1; }
          [[ "${IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${EC2_INSTANCE_ID_1}" =~ ^i-[0-9a-f]+$ ]]
          if [[ -n "${EC2_INSTANCE_ID_2}" ]]; then
            [[ "${EC2_INSTANCE_ID_2}" =~ ^i-[0-9a-f]+$ ]]
          fi
          [[ "${AWS_REGION}" == "ap-southeast-2" ]]

  # ---------------------------------------------------------------------------
  # 2. BUILD & PUBLISH - builds backend and frontend in parallel and pushes
  #    directly to Amazon ECR. Skips building if the image tag already exists.
  # ---------------------------------------------------------------------------
  build-and-publish:
    name: Build & Publish ${{ matrix.component }}
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push if not already in ECR
        shell: bash
        run: |
          set -euo pipefail
          repo="cibf-${{ matrix.component }}"

          # Check before building to save runner minutes and cost
          if aws ecr describe-images --repository-name "${repo}" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "${repo}:${IMAGE_TAG} already exists in ECR, skipping build."
            exit 0
          fi

          echo "Building ${repo}:${IMAGE_TAG}..."
          docker build --pull \
            -f "${{ matrix.component }}/Dockerfile" \
            -t "${ECR_REGISTRY}/${repo}:${IMAGE_TAG}" \
            "${{ matrix.component }}"

          echo "Pushing ${repo}:${IMAGE_TAG} to ECR..."
          docker push "${ECR_REGISTRY}/${repo}:${IMAGE_TAG}"

  # ---------------------------------------------------------------------------
  # 3. DEPLOY - rolling deploy through Systems Manager (SSM).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2 (rolling)
    needs: build-and-publish
    runs-on: ubuntu-24.04
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy the image through Systems Manager (Rolling Deployment)
        shell: bash
        run: |
          set -euo pipefail
          TARGET_INSTANCES=("${EC2_INSTANCE_ID_1}")
          if [[ -n "${EC2_INSTANCE_ID_2}" ]]; then
            TARGET_INSTANCES+=("${EC2_INSTANCE_ID_2}")
          fi

          parameters="{\"commands\":[\"sudo /opt/bookfair/aws-deploy.sh ${IMAGE_TAG}\"]}"

          for inst in "${TARGET_INSTANCES[@]}"; do
            echo "=== Deploying CIBF ${IMAGE_TAG} to ${inst} ==="
            command_id=$(aws ssm send-command \
              --region "${AWS_REGION}" \
              --instance-ids "${inst}" \
              --document-name AWS-RunShellScript \
              --parameters "${parameters}" \
              --comment "Deploy CIBF ${IMAGE_TAG} to ${inst}" \
              --query 'Command.CommandId' \
              --output text)

            echo "SSM command ${command_id} dispatched to ${inst}. Waiting for deployment to complete..."

            # Waits up to 10 minutes for Docker pull + Spring Boot startup
            TIMEOUT_SECONDS=600
            ELAPSED=0
            STATUS="InProgress"

            while [[ "${STATUS}" == "InProgress" || "${STATUS}" == "Pending" || "${STATUS}" == "Delayed" ]]; do
              sleep 10
              ELAPSED=$((ELAPSED + 10))

              STATUS=$(aws ssm get-command-invocation \
                --region "${AWS_REGION}" \
                --command-id "${command_id}" \
                --instance-id "${inst}" \
                --query 'Status' \
                --output text 2>/dev/null || echo "InProgress")

              echo "Deployment status on ${inst} (${ELAPSED}s elapsed): ${STATUS}"

              if [[ "${ELAPSED}" -ge "${TIMEOUT_SECONDS}" ]]; then
                echo "Deployment timed out after ${TIMEOUT_SECONDS}s on ${inst}!" >&2
                break
              fi
            done

            if [[ "${STATUS}" != "Success" ]]; then
              echo "Deployment ended with status '${STATUS}' on ${inst}!" >&2
              aws ssm get-command-invocation \
                --region "${AWS_REGION}" \
                --command-id "${command_id}" \
                --instance-id "${inst}" \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output yaml
              exit 1
            fi

            echo "Successfully deployed to ${inst}!"
            aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${command_id}" \
              --instance-id "${inst}" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output yaml
          done
