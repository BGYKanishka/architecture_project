services:
  backend:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/cibf-backend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - path: /etc/bookfair/runtime.env
        format: raw
    volumes:
      - /etc/bookfair/rds-global-bundle.pem:/opt/certs/rds-global-bundle.pem:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/stalls/halls >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  frontend:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/cibf-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 256m

