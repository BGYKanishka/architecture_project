version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookfair-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookfair_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookfair_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookfair-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookfair_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      SPRING_JPA_SHOW_SQL: "false"
      AWS_REGION: "${AWS_REGION:-ap-southeast-2}"
      COGNITO_USER_POOL_ID: "${COGNITO_USER_POOL_ID:?Set COGNITO_USER_POOL_ID in .env}"
      COGNITO_CLIENT_ID: "${COGNITO_CLIENT_ID:?Set COGNITO_CLIENT_ID in .env}"
      COGNITO_CLIENT_SECRET: "${COGNITO_CLIENT_SECRET:?Set COGNITO_CLIENT_SECRET in .env}"
      COGNITO_DOMAIN: "${COGNITO_DOMAIN:?Set COGNITO_DOMAIN in .env}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://localhost:3000}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      CSRF_COOKIE_SECURE: "${CSRF_COOKIE_SECURE:-false}"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:80
      SPRING_MAIL_HOST: "${SPRING_MAIL_HOST:-email-smtp.ap-southeast-2.amazonaws.com}"
      SPRING_MAIL_PORT: "${SPRING_MAIL_PORT:-587}"
      SPRING_MAIL_USERNAME: "${SPRING_MAIL_USERNAME:-}"
      SPRING_MAIL_PASSWORD: "${SPRING_MAIL_PASSWORD:-}"
      APP_MAIL_FROM: "${APP_MAIL_FROM:-}"
      AWS_SQS_EMAIL_QUEUE_URL: "${AWS_SQS_EMAIL_QUEUE_URL:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookfair-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
